name: bird-index-nas
services:
  app:
    image: plumivault:compact-r12
    platform: linux/amd64
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.compact
      network: none
      pull: false
    user: "${BIRD_UID:?set NAS user UID}:${BIRD_GID:?set NAS user GID}"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    cpus: 2.0
    mem_limit: 6g
    pids_limit: 320
    stop_grace_period: 45s
    ports: ["${BIRD_BIND_IP:?set NAS LAN IP}:8443:8443"]
    environment:
      BIRD_PUBLIC_ORIGIN: "https://${BIRD_BIND_IP:?set NAS LAN IP}:8443"
      BIRD_SITE_ADDRESS: "https://${BIRD_BIND_IP:?set NAS LAN IP}:8443"
      BIRD_TLS_SERVER_NAME: "${BIRD_BIND_IP:?set NAS LAN IP}"
      BIRD_AUTH_HASH: "${BIRD_AUTH_HASH:?set existing bcrypt hash}"
      BIRD_GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
    secrets: [gateway_token]
    volumes:
      - type: bind
        source: "${BIRD_PHOTOS_PATH:?set existing photo directory}"
        target: /photos
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: "${BIRD_PHOTO_PARENT:?set existing organizer parent}"
        target: /library
        bind: {create_host_path: false}
      - type: bind
        source: ./data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ./models
        target: /models
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./config
        target: /config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./gateway-data
        target: /gateway-data
        bind: {create_host_path: false}
      - type: bind
        source: ./gateway-config
        target: /gateway-config
        bind: {create_host_path: false}
    tmpfs: ["/tmp:size=128m,noexec,nosuid"]
    logging: {driver: json-file, options: {max-size: 5m, max-file: "3"}}
secrets:
  gateway_token: {file: ./config/gateway-token}
